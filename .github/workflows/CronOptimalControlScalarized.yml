name: Cron OptimalControlScalarized

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:
    inputs:
      problems:
        description: "Only these problems, comma-separated (e.g. beam): publishes their results, leaves the reports, the state and the issues"
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  cron:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/cron-reusable.yml
    with:
      environment: OptimalControlScalarized
      problems: ${{ inputs.problems }}
      gpu: true
    secrets: inherit
