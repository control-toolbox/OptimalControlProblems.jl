name: Cron OptimalControlScalarized

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cron:
    permissions:
      actions: read
      contents: write
      issues: write
    uses: ./.github/workflows/cron-reusable.yml
    with:
      environment: OptimalControlScalarized
      gpu: true
    secrets: inherit
