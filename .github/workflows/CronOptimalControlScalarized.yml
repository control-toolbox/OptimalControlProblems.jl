name: Cron OptimalControlScalarized

on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  cron:
    uses: ./.github/workflows/cron-reusable.yml
    with:
      environment: OptimalControlScalarized
      gpu: true
    secrets: inherit
