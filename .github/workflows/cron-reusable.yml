name: Cron (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Test environment passed to Pkg.test
        required: true
        type: string
      gpu:
        description: Run the scope on the automatic GPU runner as well
        required: false
        default: false
        type: boolean
      enabled:
        description: Keep a future scope disabled until its environment exists
        required: false
        default: true
        type: boolean
      mode:
        description: Test mode passed to Pkg.test (cron, or robustness for the monthly report of #378)
        required: false
        default: cron
        type: string
      scope:
        description: Name of the scope in the reports, the state and the issues; the environment by default
        required: false
        default: ''
        type: string
      note:
        description: One line describing the scope, shown under its name in the reports and issues
        required: false
        default: ''
        type: string
      problems:
        description: >-
          Only these problems (comma-separated; empty, the default: all). A restricted run
          publishes the results of its problems (#314) and leaves the scope report, the state
          and the issues as the last complete run left them.
        required: false
        default: ''
        type: string
      runs_on:
        description: >-
          The runners of the CPU job, a JSON list. The report expects one report from each:
          a runner that leaves none (killed, #435) is a finding. macOS is left out for now
          (scarce runners, long queues); it comes back with #344.
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      budget:
        description: >-
          Time budget of a run, in seconds (#435). 0, the default: every problem, in one
          process per environment. Otherwise a rotation: the problems of the modeling, tested
          longest ago first (tools/cron/select.py), one process each, while the budget lasts;
          the reports and issues keep the last result of every problem.
        required: false
        default: 0
        type: number
    secrets:
      SSH_KEY:
        required: false
      CT_RUNNERS_CLIENT_ID:
        required: false
      CT_RUNNERS_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  # The arguments of the tests: in a rotation (budget > 0), the problems of the modeling, the
  # ones tested longest ago first, read from the `results` branch (#435).
  select:
    if: inputs.enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_args: ${{ steps.args.outputs.test_args }}
      problems: ${{ steps.args.outputs.problems }}
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Test arguments
        id: args
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          PROBLEMS: ${{ inputs.problems }}
          BUDGET: ${{ inputs.budget }}
          SCOPE: ${{ inputs.scope || inputs.environment }}
        run: |
          set -euo pipefail
          args="$ENVIRONMENT $MODE"
          problems=""
          if [ "$BUDGET" != "0" ]; then
            results=""
            if git ls-remote --exit-code origin results >/dev/null 2>&1; then
              git fetch --depth 1 origin results
              git worktree add --detach "$RUNNER_TEMP/results" FETCH_HEAD
              results="$RUNNER_TEMP/results"
            fi
            problems=$(python3 tools/cron/select.py --scope "$SCOPE" \
              --models-dir "ext/${ENVIRONMENT}Models" --metadata-dir ext/MetaData \
              ${results:+--results-dir "$results"})
            if [ -z "$problems" ]; then
              echo "::error::a budget needs the problems of ext/${ENVIRONMENT}Models/"
              exit 1
            fi
            # problems given by hand come first, in their order
            order="${PROBLEMS:+$PROBLEMS,}$problems"
            order=$(echo "$order" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd, -)
            args="$args problem=$order budget=$BUDGET"
          elif [ -n "$PROBLEMS" ]; then
            args="$args problem=$PROBLEMS"
          fi
          echo "test_args=$args" >> "$GITHUB_OUTPUT"
          echo "problems=$problems" >> "$GITHUB_OUTPUT"
          echo "Test arguments: $args"

  # The called CTActions workflows request `actions`, `contents` and `pull-requests` read
  # (their `changes` job) and `statuses` write (their `status-start` and `status-end` jobs); a
  # nested job cannot be granted less than it requests.
  cpu:
    if: inputs.enabled
    needs: select
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      versions: '["1.13"]'
      runs_on: ${{ inputs.runs_on }}
      # keep every platform running after a failure: one report per platform is needed
      fail_fast: false
      use_ct_registry: true
      test_args: ${{ needs.select.outputs.test_args }}
      upload_artifact_path: test/reports
      upload_artifact_name: cron-${{ inputs.scope || inputs.environment }}
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}

  gpu:
    if: inputs.enabled && inputs.gpu
    needs: select
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    uses: control-toolbox/CTActions/.github/workflows/ci-gpu.yml@main
    with:
      versions: '["1.13"]'
      use_ct_registry: true
      test_args: ${{ needs.select.outputs.test_args }}
      upload_artifact_path: test/reports
      upload_artifact_name: cron-${{ inputs.scope || inputs.environment }}-gpu
      fail_fast: false
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      CT_RUNNERS_CLIENT_ID: ${{ secrets.CT_RUNNERS_CLIENT_ID }}
      CT_RUNNERS_PRIVATE_KEY: ${{ secrets.CT_RUNNERS_PRIVATE_KEY }}

  publish:
    if: always() && inputs.enabled
    needs: [select, cpu, gpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: cron-results
      cancel-in-progress: false
    env:
      SCOPE: ${{ inputs.scope || inputs.environment }}
      # env var, not inline in the run steps: the note is data, not shell (backticks, quotes)
      SCOPE_NOTE: ${{ inputs.note }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TESTS_FAILED: ${{ needs.cpu.result != 'success' || needs.gpu.result == 'failure' }}
      RESULTS_DIR: /tmp/cron-results
      RUNNERS: ${{ join(fromJSON(inputs.runs_on), ',') }}
      # a restricted run writes its report and state aside, unpublished (`problems` input);
      # not in a rotation, where every run tests some problems and updates their results
      PARTIAL: ${{ inputs.problems != '' && inputs.budget == 0 }}
      # a rotation (#435): every problem of the scope, for the reports and issues
      ROTATION: ${{ needs.select.outputs.problems }}
    steps:
      - name: Checkout package
        uses: actions/checkout@v4

      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: cron-${{ inputs.scope || inputs.environment }}*
          path: artifacts

      - name: Ensure the reports directory exists
        shell: bash
        run: mkdir -p artifacts

      - name: Prepare the single-commit results tree
        shell: bash
        run: |
          set -euo pipefail
          cp tools/cron/report.py "$RUNNER_TEMP/cron-report.py"
          if git ls-remote --exit-code origin results >/dev/null 2>&1; then
            git fetch origin results
            git worktree add --detach "$RESULTS_DIR" origin/results
            backup="$RUNNER_TEMP/results-backup"
            mkdir -p "$backup"
            find "$RESULTS_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} "$backup/" \;
          else
            git worktree add --detach "$RESULTS_DIR" HEAD
            backup=''
          fi
          # `switch --orphan` already empties the index and the working tree
          git -C "$RESULTS_DIR" switch --orphan cron-results
          if [ -n "$backup" ]; then
            find "$backup" -mindepth 1 -maxdepth 1 -exec cp -a {} "$RESULTS_DIR/" \;
          fi
          mkdir -p "$RESULTS_DIR/cron"

      # Also writes, for the documentation (#314), `problems/`, `env/` and `manifest.json`:
      # the results and trajectories of the solves of the scope, merged with the other scopes.
      - name: Write report, results and observed state
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml | head -1)
          test_failed_arg=()
          [ "$TESTS_FAILED" = "true" ] && test_failed_arg+=(--tests-failed)
          cron_dir="$RESULTS_DIR/cron"
          if [ "$PARTIAL" = "true" ]; then
            cron_dir="$RUNNER_TEMP/cron"
            mkdir -p "$cron_dir"
            [ -f "$RESULTS_DIR/cron/state.json" ] && cp "$RESULTS_DIR/cron/state.json" "$cron_dir/"
          fi
          python3 "$RUNNER_TEMP/cron-report.py" \
            --reports-dir artifacts \
            --scope "$SCOPE" \
            --run-url "$RUN_URL" \
            --state-file "$cron_dir/state.json" \
            --output "$cron_dir/$SCOPE.md" \
            --results-dir "$RESULTS_DIR" \
            --sha "$GITHUB_SHA" \
            --julia-version '1.13' \
            --package-version "$package_version" \
            --scope-note "$SCOPE_NOTE" \
            --rotation "$ROTATION" \
            --runners "$RUNNERS" \
            "${test_failed_arg[@]}"

      - name: Publish report, results and observed state
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RESULTS_DIR" config user.name github-actions[bot]
          git -C "$RESULTS_DIR" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # the whole tree: `cron/`, and `problems/`, `env/` and `manifest.json` (#314)
          git -C "$RESULTS_DIR" add --all
          git -C "$RESULTS_DIR" commit -m "ci: publish $SCOPE cron report" --allow-empty
          if git ls-remote --exit-code origin results >/dev/null 2>&1; then
            git -C "$RESULTS_DIR" push --force-with-lease origin HEAD:refs/heads/results
          else
            git -C "$RESULTS_DIR" push origin HEAD:refs/heads/results
          fi

      - name: Update cron issues
        id: issues
        if: env.PARTIAL != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test_failed_arg=()
          [ "$TESTS_FAILED" = "true" ] && test_failed_arg+=(--tests-failed)
          python3 "$RUNNER_TEMP/cron-report.py" \
            --reports-dir artifacts \
            --scope "$SCOPE" \
            --run-url "$RUN_URL" \
            --state-file "$RESULTS_DIR/cron/state.json" \
            --output "$RESULTS_DIR/cron/$SCOPE.md" \
            --sha "$GITHUB_SHA" \
            --julia-version '1.13' \
            --package-version "$(sed -n 's/^version = \"\(.*\)\"/\1/p' Project.toml | head -1)" \
            --scope-note "$SCOPE_NOTE" \
            --rotation "$ROTATION" \
            --runners "$RUNNERS" \
            --issues \
            "${test_failed_arg[@]}"

      - name: Publish issue state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # nothing to publish when the results tree was not prepared
          [ -f "$RESULTS_DIR/cron/state.json" ] || exit 0
          git -C "$RESULTS_DIR" add cron/state.json
          if ! git -C "$RESULTS_DIR" diff --cached --quiet; then
            git -C "$RESULTS_DIR" commit --amend --no-edit
            git -C "$RESULTS_DIR" push --force-with-lease origin HEAD:refs/heads/results
          fi

      - name: Report the run outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.cpu.result }}" != "success" ] || \
             [ "${{ needs.gpu.result }}" = "failure" ] || \
             { [ "$PARTIAL" != "true" ] && [ "${{ steps.issues.outcome }}" != "success" ]; }; then
            echo "A cron test or issue-update job failed."
            exit 1
          fi
