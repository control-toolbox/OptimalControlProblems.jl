name: Cron OptimalControl

on:
  schedule:
    - cron: "0 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cron:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/cron-reusable.yml
    with:
      environment: OptimalControl
      gpu: true
    secrets: inherit
