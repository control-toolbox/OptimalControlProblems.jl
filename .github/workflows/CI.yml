name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]

jobs:
  # Turn the `test <environment> backend` / `test comparison` labels of a pull request into
  # the arguments of test/runtests.jl (environment names). Without such a label, or outside
  # a pull request, the arguments are empty and every environment runs.
  scope:
    runs-on: ubuntu-latest
    outputs:
      test_args: ${{ steps.scope.outputs.test_args }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the cron report tooling
        run: python3 -m unittest discover -s tools/cron/test -p 'test_*.py' -v

      - id: scope
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          args=$(echo "$LABELS" | jq -r '[(. // [])[] | select(startswith("test ")) | sub("^test "; "") | sub(" backend$"; "")] | join(" ")')
          echo "test_args=$args" >> "$GITHUB_OUTPUT"
          echo "test_args: '$args'"

  # On a pull request, run when the runner label is set: on a push, on the runner label
  # being added, or on a scope label (`test ...`) being added or removed, which changes what
  # runs. Other label events do not rerun the CI.
  call:
    needs: scope
    if: >
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run ci github-runner') &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'run ci github-runner' ||
          startsWith(github.event.label.name, 'test ')))
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@feat/134-cancel-superseded-runs
    with:
      # Temporary, during the reorganisation of #310: Ubuntu and Julia 1.13 only.
      # Restore Julia 1.10 and macOS/Windows at the end (#344).
      versions: '["1.13"]'
      runs_on: '["ubuntu-latest"]'
      runner_type: 'github'
      use_ct_registry: true
      test_args: ${{ needs.scope.outputs.test_args }}
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
