name: CI

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]

jobs:
  # Turn scope labels and per-problem pull request changes into the arguments of
  # test/runtests.jl. Without a scope label, or outside a pull request, every environment
  # and problem runs.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test_args: ${{ steps.scope.outputs.test_args }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          force_all=$(echo "$LABELS" | jq -r 'any(.[]?; . == "release" or . == "test all problems")')
          args=$(echo "$LABELS" | jq -r '[.[]? | select(startswith("test ")) | select(. != "test all problems") | sub("^test "; "") | sub(" backend$"; "")] | join(" ")')
          if [[ "${{ github.event_name }}" == "pull_request" && "$force_all" != "true" ]]; then
            files=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[] | [.status, .filename] | @tsv')
            problems=()
            all_per_problem=true
            while IFS=$'\t' read -r status filename; do
              [[ -n "$filename" ]] || continue
              if [[ "$status" != "added" && "$status" != "modified" ]]; then
                all_per_problem=false
                break
              fi
              if [[ "$filename" =~ ^ext/MetaData/([^/]+)\.jl$ ||
                    "$filename" =~ ^ext/Descriptions/([^/]+)\.md$ ||
                    "$filename" =~ ^ext/[^/]+Models/([^/]+)\.jl$ ]]; then
                problems+=("${BASH_REMATCH[1]}")
              else
                all_per_problem=false
                break
              fi
            done <<< "$files"
            if [[ "$all_per_problem" == "true" && "${#problems[@]}" -gt 0 ]]; then
              unique_problems=$(printf '%s\n' "${problems[@]}" | sort -u | paste -sd, -)
              args="${args:+$args }problem=$unique_problems"
              echo "changed problems: $unique_problems"
            else
              echo "shared change: running all problems"
            fi
          else
            echo "override or release PR: running all problems"
          fi
          echo "test_args=$args" >> "$GITHUB_OUTPUT"
          echo "test_args: '$args'"

  # On a pull request, run when the runner label is set: on a push, on the runner label
  # being added, or on a scope label (`test ...`) being added or removed, which changes what
  # runs. Other label events do not rerun the CI.
  call:
    needs: scope
    if: >
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run ci github-runner') &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'run ci github-runner' ||
          startsWith(github.event.label.name, 'test ')))
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      versions: '["1.10", "1.13"]'
      runs_on: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      runner_type: 'github'
      use_ct_registry: true
      test_args: ${{ needs.scope.outputs.test_args }}
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
