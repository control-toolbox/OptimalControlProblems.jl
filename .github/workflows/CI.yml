name: CI
run-name: "CI ${{ inputs.target }}${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

# On a pull request, a label starts its own run through Labels.yml
# (CTActions docs/workflows/label-dispatch.md): `target` says which runner, `pr` which
# pull request. The scope of the CI is read from that pull request.

on:
  push:
    branches:
      - main
    tags: '*'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number, set by label-dispatch.yml'
        required: false
        default: ''
      target:
        description: 'github, occidata or kkt'
        required: false
        default: ''

jobs:
  # Turn the files a pull request changes, and its scope labels, into the arguments of
  # test/runtests.jl (tools/ci/scope.py, #405): each file gives environments and
  # problems, the run is their union, and the labels only add (`test <env> backend`,
  # `test comparison`, `test all problems`, `test everything`). Outside a pull request
  # everything runs; narrowing only happens on positive evidence: the `release` label, a
  # shared change, a removed or renamed file and any unreadable or truncated file list
  # run everything. The rules are in test/README.md.
  scope:
    if: github.event_name == 'push' || inputs.target == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test_args: ${{ steps.scope.outputs.test_args }}
    steps:
      - uses: actions/checkout@v4
      # The labels and the number of changed files of the pull request: a dispatched run
      # has no pull request in its event.
      - id: pr
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            --jq '"labels=\([.labels[].name] | tojson)", "changed_files=\(.changed_files)"' >> "$GITHUB_OUTPUT"
      - id: files
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          # Written only on success: a failed call leaves no list and the scope step
          # runs the complete catalogue.
          if gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
              --jq '.[] | [.status, .filename] | @tsv' > changed_files.tsv.new; then
            mv changed_files.tsv.new changed_files.tsv
          else
            rm -f changed_files.tsv.new
            echo "::warning::could not list the pull request files; the complete catalogue runs"
          fi

      - name: Test the CI tooling
        run: |
          python3 -m unittest discover -s tools/cron/test -p 'test_*.py' -v
          python3 -m unittest discover -s tools/ci/test -p 'test_*.py' -v

      - id: scope
        env:
          # null outside a pull request: the script reads it as no label.
          LABELS: ${{ steps.pr.outputs.labels || 'null' }}
          EVENT: ${{ inputs.pr != '' && 'pull_request' || github.event_name }}
          CHANGED_FILES: ${{ steps.pr.outputs.changed_files }}
        run: |
          args=$(cat changed_files.tsv 2>/dev/null | python3 tools/ci/scope.py \
            --event "$EVENT" \
            --labels "$LABELS" \
            --expected-files "$CHANGED_FILES" \
            --summary "$GITHUB_STEP_SUMMARY")
          echo "test_args=$args" >> "$GITHUB_OUTPUT"
          echo "test_args: '$args'"

  # On a push, and for the runner label (target github): the scope labels `test ...` and
  # `release` run it again through Labels.yml (restart_labels).
  call:
    needs: scope
    if: github.event_name == 'push' || inputs.target == 'github'
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      # Temporary, during the reorganisation of #310: Ubuntu and Julia 1.13 only.
      # Restore Julia 1.10 and macOS/Windows at the end (#344).
      versions: '["1.13"]'
      runs_on: '["ubuntu-latest"]'
      runner_type: 'github'
      use_ct_registry: true
      test_args: ${{ needs.scope.outputs.test_args }}
      upload_artifact_path: test/reports
      upload_artifact_name: ci
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}

  # What the run tested, from the reports of the environments (tools/ci/results.py), in
  # the job summary next to the scope decision. Runs after a failure too: the reports are
  # uploaded then as well.
  results:
    needs: call
    if: always() && needs.call.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-*
          path: artifacts
      - run: python3 tools/ci/results.py --reports artifacts --summary "$GITHUB_STEP_SUMMARY" > /dev/null

  # GPU tests (environment `GPU`: Exa and MadNLP on the GPU, test/README.md) on the
  # self-hosted runners, on a pull request with the runner label (target occidata or kkt).
  test-gpu-occidata:
    if: inputs.target == 'occidata'
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      versions: '["1.13"]'
      runs_on: '[["occidata"]]'
      runner_type: 'self-hosted'
      use_ct_registry: true
      test_args: 'GPU'
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}

  test-gpu-kkt:
    if: inputs.target == 'kkt'
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      versions: '["1.13"]'
      runs_on: '[["kkt"]]'
      runner_type: 'self-hosted'
      use_ct_registry: true
      test_args: 'GPU'
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}

  # On a push (main, tags): a single GPU run, on kkt unless it is offline, else occidata
  # (CTActions ci-gpu.yml).
  test-gpu-main:
    if: github.event_name == 'push'
    uses: control-toolbox/CTActions/.github/workflows/ci-gpu.yml@main
    with:
      versions: '["1.13"]'
      use_ct_registry: true
      test_args: 'GPU'
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      CT_RUNNERS_CLIENT_ID: ${{ secrets.CT_RUNNERS_CLIENT_ID }}
      CT_RUNNERS_PRIVATE_KEY: ${{ secrets.CT_RUNNERS_PRIVATE_KEY }}
