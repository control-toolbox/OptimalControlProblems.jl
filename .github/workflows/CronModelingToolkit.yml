name: Cron ModelingToolkit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cron:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/cron-reusable.yml
    with:
      environment: ModelingToolkit
      enabled: false
      note: "`CronModelingToolkit.yml` · manual only until the scope exists"
    secrets: inherit
