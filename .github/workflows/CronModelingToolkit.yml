name: Cron ModelingToolkit

on:
  schedule:
    # daily: a rotation (#435), each run tests the problems tested longest ago for an hour
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      problems:
        description: "These problems first, comma-separated (e.g. beam), then the others while the budget lasts"
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  cron:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/cron-reusable.yml
    with:
      environment: ModelingToolkit
      problems: ${{ inputs.problems }}
      budget: 3600
      note: "`CronModelingToolkit.yml` · daily (04:00 UTC), a rotation with a budget of 1 h (#435) · Julia 1.13, Ubuntu + Windows, CPU"
    secrets: inherit
