[deps]
CTDirect = "790bbbee-bee9-49ee-8912-a9de031322d5"
# Not used directly: bounded below, until the port to OptimalControl v2 (#283).
ExaModels = "1037b233-b668-4ce9-9b63-f9f681f55dd2"
NLPModelsIpopt = "f4238b75-b362-5c4c-b852-0801c9a21d71"
OptimalControl = "5f98b655-cc9a-415a-b60e-744165666948"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[compat]
CTDirect = "0.17"
# ExaModels ≥ 0.9.5 defines `zero(::Type{<:ExaModels.AbstractNode})`, which CTParser 0.8.2
# (OptimalControl v1) redefines: on Julia 1.13 this method overwriting makes the
# precompilation of CTParser, hence the loading of OptimalControl, fail. The v2 stack
# (CTParser ≥ 0.8.17, ExaModels 0.12) has no such conflict.
ExaModels = "0.9 - 0.9.4"
NLPModelsIpopt = "0.11"
OptimalControl = "1.1"
Test = "1"
